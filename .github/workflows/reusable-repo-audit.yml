name: Reusable Repository Security and Quality Audit

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: reusable-repo-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Secrets, source, dependency and configuration scans
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare reports
        run: mkdir -p reports

      - name: Gitleaks secret scan
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" --entrypoint gitleaks zricethezav/gitleaks:v8.30.1 git /src --redact --report-format sarif --report-path /src/reports/gitleaks.sarif --exit-code 0

      - name: Semgrep static analysis
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: docker run --rm -v "$PWD:/src" --entrypoint semgrep semgrep/semgrep:1.185.0 scan --config p/default --metrics off --exclude .git --exclude node_modules --exclude .venv --exclude dist --exclude build --sarif --output /src/reports/semgrep.sarif /src

      - name: Trivy filesystem, dependency, secret and misconfiguration scan
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" --entrypoint trivy aquasec/trivy:0.76.2 fs --scanners vuln,misconfig,secret --skip-dirs .git --skip-dirs node_modules --skip-dirs .venv --format sarif --output /src/reports/trivy.sarif /src

      - name: OSV-Scanner dependency scan
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.1 scan source -r /src --format json --output-file /src/reports/osv.json

      - name: Ruff Python lint
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.17.4
          ruff check . --exclude .git --exclude node_modules --exclude .venv --output-format json --output-file reports/ruff.json

      - name: npm dependency audit
        continue-on-error: true
        shell: bash
        run: |
          i=0
          while IFS= read -r -d '' lockfile; do
            package_dir="$(dirname "$lockfile")"
            if [[ -f "$package_dir/package.json" ]]; then
              i=$((i + 1))
              (cd "$package_dir" && npm audit --json) > "reports/npm-audit-$i.json" || true
            fi
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' -print0)

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: repository-audit-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
